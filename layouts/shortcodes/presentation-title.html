{{/* Shared 1280×720 cover matching the VibeCoding4Simulation title page. */}}
<style>
  .reveal .slides section.presentation-cover { top: 0 !important; }
  .reveal .presentation-title {
    box-sizing: border-box;
    width: 100%;
    height: 720px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
    text-align: left;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .reveal .presentation-title h1 {
    color: #fff;
    font-family: inherit;
    font-size: 54px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: normal;
    text-transform: none;
    margin: 0 0 20px;
  }
  .reveal .presentation-title-logo { width: 250px; margin-bottom: 40px; }
  .reveal .presentation-title-logo img {
    width: 100% !important;
    height: auto !important;
    max-height: none !important;
    display: block;
    filter: brightness(0) invert(1);
    margin: 0 !important;
    box-shadow: none;
  }
  .reveal .presentation-title hr {
    width: 100%;
    height: 1px;
    border: 0;
    background: rgba(255, 255, 255, .5);
    margin: 0 0 30px;
  }
  .reveal .presentation-title-author { font-size: 27px; font-weight: 400; margin-bottom: 8px; }
  .reveal .presentation-title-affiliation { font-size: 21px; opacity: .9; margin-bottom: 8px; }
  .reveal .presentation-title-date { font-size: 15px; opacity: .8; }
</style>
<div class="presentation-title">
  <h1>{{ .Page.Title }}</h1>
  <div class="presentation-title-logo">
    <img src="{{ "images/shared/JKU_Logo.svg" | relURL }}" alt="Johannes Kepler University Linz">
  </div>
  <hr class="presentation-title-divider">
  <div class="presentation-title-author">Eric Volkmann</div>
  <div class="presentation-title-affiliation">Johannes Kepler University Linz</div>
  <div class="presentation-title-date">{{ .Page.Date.Format "02.01.2006" }}</div>
</div>
