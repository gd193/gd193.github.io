    <circle cx="92" cy="120" r="11" fill="#0078aa"/><text x="120" y="127" class="mid">nonlinear E×B bracket</text>
    <circle cx="92" cy="175" r="11" fill="#009688"/><text x="120" y="182" class="mid">FFT/IFFT HBM traffic</text>
    <circle cx="92" cy="230" r="11" fill="#f28e2b"/><text x="120" y="237" class="mid">stencils + shifted boundaries</text>
    <circle cx="92" cy="285" r="11" fill="#b83280"/><text x="120" y="292" class="mid">RK4 constrained by CFL</text>
  </g>
